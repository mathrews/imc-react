name: CI do IMC

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências do lock
        run: npm ci
      - name: Testes unitários
        run: npm run test:unit
      - name: Testes de integração
        if: ${{ !cancelled() }}
        run: npm run test:integration
      - name: Instalar navegador
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: Testes funcionais
        if: ${{ !cancelled() }}
        run: npm run test:functional
      - name: Testes ponta a ponta
        if: ${{ !cancelled() }}
        run: npm run test:e2e
      - name: Build React
        run: npm run build
      - name: Guardar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
